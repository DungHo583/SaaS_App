services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_app
      POSTGRES_USER: saas_app
      POSTGRES_PASSWORD: saas_app_dev
    ports:
      - "5432:5432"
    volumes:
      - saas_app_postgres_data:/var/lib/postgresql/data

  # Chỉ dùng cho development: hộp thư giả lập, mọi email gửi đi được giữ lại để xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: saas_app_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  saas_app_postgres_data:
