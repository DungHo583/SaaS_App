services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_app
      POSTGRES_USER: saas_app
      POSTGRES_PASSWORD: saas_app_dev
    ports:
      - "5432:5432"
    volumes:
      - saas_app_postgres_data:/var/lib/postgresql/data

volumes:
  saas_app_postgres_data:
